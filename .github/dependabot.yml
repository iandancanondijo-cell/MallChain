version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Enable version updates for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Enable version updates for npm (backend)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # Enable version updates for npm (frontend)
  - package-ecosystem: "npm"
    directory: "/mallchain-os-v14"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # Root workspace manifest (backend, mallchain-os-v14, packages/*, explorer/backend,
  # e2e, scripts — see the root package.json's "workspaces" list)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      root-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/packages/shared-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      shared-ui-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/packages/shared-config"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      shared-config-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/explorer/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      explorer-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      e2e-dependencies:
        patterns:
          - "*"
