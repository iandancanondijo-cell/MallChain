name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.0'   # matches go.mod

      - name: Build blockchain binary
        run: go build -o /tmp/marketplaced ./cmd/marketplaced

      - name: Run Go tests
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Go vet
        run: go vet ./...

  backend-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Lint backend
        run: cd backend && npx eslint src/ --max-warnings=0

      - name: Run backend tests
        run: cd backend && npm test -- --coverage

  frontend-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mallchain-os-v14/package-lock.json

      - name: Install frontend dependencies
        run: cd mallchain-os-v14 && npm ci

      - name: Lint frontend
        run: cd mallchain-os-v14 && npx eslint src/ --ext .ts,.tsx

      - name: Typecheck frontend
        run: cd mallchain-os-v14 && npm run typecheck

      - name: Test frontend
        run: cd mallchain-os-v14 && npm run test:run

      - name: Build frontend
        run: cd mallchain-os-v14 && npm run build

  lighthouse:
    # P1: performance/accessibility budget on the built frontend assets
    # (mallchain-os-v14/lighthouserc.cjs) — runs against the static build
    # only (lhci's own local static server), no live backend/staging
    # environment needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mallchain-os-v14/package-lock.json

      - name: Install frontend dependencies
        run: cd mallchain-os-v14 && npm ci

      - name: Build frontend
        run: cd mallchain-os-v14 && npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com # build-time only for this budget check — no real network calls happen during a Lighthouse static-asset audit

      - name: Run Lighthouse CI
        run: cd mallchain-os-v14 && npx @lhci/cli@0.15.1 autorun

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Audit backend dependencies
        run: cd backend && npm audit --audit-level=high

      - name: Audit frontend dependencies
        run: cd mallchain-os-v14 && npm audit --audit-level=high

      - name: Audit shared-ui dependencies
        run: cd packages/shared-ui && npm audit --audit-level=high

      - name: Audit shared-config dependencies
        run: cd packages/shared-config && npm audit --audit-level=high

      - name: Audit explorer backend dependencies
        run: cd explorer/backend && npm audit --audit-level=high

      - name: Audit e2e dependencies
        run: cd e2e && npm audit --audit-level=high

  osv-scan:
    # Open-source, no-account equivalent of a socket.dev/deps.dev dependency
    # check — queries the OSV.dev vulnerability database (Go modules + every
    # npm workspace) without needing a Socket account/API token provisioned.
    # Full Socket.dev supply-chain-risk scoring (install-script/typosquat
    # detection) is a separate product needing its own account and API key —
    # flagged here rather than silently left out, not implemented.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run OSV-Scanner
        # Pinned to v1.9.2 rather than the current v2 line: the bare "v1"
        # tag this used to read no longer exists in this repo (only granular
        # v1.x.y and v2.x.y tags do), so this ref was already unresolvable
        # as written. v1.9.2 is the last v1 release and keeps this a pure
        # SHA-pin, not a version bump — revisit for v2 (different action
        # inputs) separately.
        uses: google/osv-scanner-action/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638 # v1.9.2
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/ci p/owasp-top-ten p/javascript p/typescript p/golang

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build backend image
        run: docker build -t mallchain-backend:ci ./backend

      - name: Build marketplaced image
        run: docker build -t mallchain-marketplaced:ci .

      - name: Scan backend image
        # Pinned tag was previously "0.24.0" (missing the "v" prefix) — that
        # ref does not exist in this repo (only "v0.24.0" does), so this was
        # already unresolvable as written. Same version, corrected ref.
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: mallchain-backend:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan marketplaced image
        # Pinned tag was previously "0.24.0" (missing the "v" prefix) — that
        # ref does not exist in this repo (only "v0.24.0" does), so this was
        # already unresolvable as written. Same version, corrected ref.
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: mallchain-marketplaced:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
