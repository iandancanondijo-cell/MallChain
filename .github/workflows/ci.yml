name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'   # matches go.mod

      - name: Build blockchain binary
        run: go build -o /tmp/marketplaced ./cmd/marketplaced

      - name: Run Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

  backend-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Lint backend
        run: cd backend && npx eslint src/ --max-warnings=0

      - name: Run backend tests
        run: cd backend && npm test -- --coverage

  frontend-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mallchain-os-v14/package-lock.json

      - name: Install frontend dependencies
        run: cd mallchain-os-v14 && npm ci

      - name: Typecheck frontend
        run: cd mallchain-os-v14 && npm run typecheck

      - name: Test frontend
        run: cd mallchain-os-v14 && npm run test:run

      - name: Build frontend
        run: cd mallchain-os-v14 && npm run build

  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Audit backend dependencies
        run: cd backend && npm audit --audit-level=high

      - name: Audit frontend dependencies
        run: cd mallchain-os-v14 && npm audit --audit-level=high
