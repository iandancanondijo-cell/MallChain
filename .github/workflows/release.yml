# This workflow is useful if you want to automate the process of:
#
# a) Creating a new prelease when you push a new tag with a "v" prefix (version).
#
#    This type of prerelease is meant to be used for production: alpha, beta, rc, etc. types of releases.
#    After the prerelease is created, you need to make your changes on the release page at the relevant
#    Github page and publish your release.
#
# b) Creating/updating the "latest" prerelease when you push to your default branch.
#
#    This type of prelease is useful to make your bleeding-edge binaries available to advanced users.
#
# The workflow will not run if there is no tag pushed with a "v" prefix and no change pushed to your
# default branch.
on: push

# id-token: write exists for the keyless Sigstore signing below: cosign
# exchanges this workflow's GitHub OIDC token for a Fulcio certificate that
# binds every signature to this repo, this workflow file and this tag. Without
# signatures, a release is only protected by whatever hash is published next to
# it — anyone who can replace the artifact can replace its advertised digest
# too, in the same response, so the check proves nothing.
permissions:
  contents: write
  id-token: write

jobs:
  might_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Prepare Release Variables
        id: vars
        # Pinned to the ignite/cli v29.10.1 tag's commit SHA rather than
        # @main — @main is a mutable branch ref, so this job's build/release
        # steps could otherwise start running arbitrary, unreviewed code from
        # that repo at any time with no version bump or diff to review.
        uses: ignite/cli/actions/release/vars@c55cc2fe9630443fc9a5f033a332853d5ca7832b # v29.10.1

      - name: Set up Go
        # Pinned to the same version ci.yml and codeql.yml use, matching
        # go.mod — without this, "go test"/"chain build" below fall back to
        # whatever Go ubuntu-latest happens to ship, which can silently
        # drift from what's actually tested/built elsewhere in this repo.
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25' # matches go.mod's `go 1.25.0` minimum — floating to avoid an exact patch going stale (see ci.yml's go-check step)

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run Go tests
        run: go test ./...

      - name: Issue Release Assets
        uses: ignite/cli/actions/cli@c55cc2fe9630443fc9a5f033a332853d5ca7832b # v29.10.1
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        with:
          args: chain build --release --release.prefix ${{ steps.vars.outputs.tarball_prefix }} -t linux:amd64 -t darwin:amd64 -t darwin:arm64 -y
        env:
          DO_NOT_TRACK: 1
          GOFLAGS: "-buildvcs=false"

      - name: Publish checksums and keyless artifact signatures
        # Runs before "Publish the Release", so the .sig/.crt files land in
        # release/ alongside the tarballs and ride along with `files: release/*`
        # with no change to that step.
        #
        # No `continue-on-error`: a release this pipeline cannot sign should
        # stop the job, not ship quietly. The alternative is a published
        # artifact whose only integrity claim is a digest hosted next to it.
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        shell: bash
        env:
          DO_NOT_TRACK: 1
        run: |
          set -euo pipefail
          cd release

          if ! command -v cosign >/dev/null 2>&1; then
            echo "::error::cosign is missing from this runner image. Refusing to publish unsigned binaries — add a pinned cosign install step rather than relaxing this check."
            exit 1
          fi
          echo "Signing with cosign $(cosign version 2>/dev/null | awk '/^GitVersion/{print $2}')"

          # Sign what the build actually produced, not a guessed filename
          # pattern, and never re-sign a signature from a previous run.
          find . -maxdepth 1 -type f \
            ! -name 'checksums.txt' ! -name '*.sig' ! -name '*.crt' ! -name '*.pem' \
            -printf '%f\n' | LC_ALL=C sort > /tmp/artifacts.txt
          if [ ! -s /tmp/artifacts.txt ]; then
            echo "::error::release/ contains no artifacts to sign; the build step produced nothing."
            exit 1
          fi

          xargs -a /tmp/artifacts.txt -d '\n' sha256sum > checksums.txt
          echo checksums.txt >> /tmp/artifacts.txt

          while IFS= read -r artifact; do
            # </dev/null: cosign must not consume the loop's stdin, or the
            # remaining artifacts silently go unsigned.
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.crt" \
              "${artifact}" >/dev/null </dev/null
          done < /tmp/artifacts.txt

          SIGNED=$(find . -maxdepth 1 -name '*.sig' | wc -l)
          TOTAL=$(( $(wc -l < /tmp/artifacts.txt) ))
          if [ "$SIGNED" -ne "$TOTAL" ]; then
            echo "::error::signed $SIGNED of $TOTAL artifacts"
            exit 1
          fi
          echo "Signed $SIGNED artifacts."

          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          {
            echo "### Signed artifacts"
            echo
            echo '```sh'
            sed 's/^/  /' checksums.txt
            echo '```'
            echo
            echo 'Verify (needs [cosign](https://github.com/sigstore/cosign)):'
            echo
            echo '```sh'
            echo "cosign verify-blob checksums.txt \\"
            echo "  --signature checksums.txt.sig \\"
            echo "  --certificate checksums.txt.crt \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity '${IDENTITY}'"
            echo "sha256sum --ignore-missing --check checksums.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Delete the "latest" Release
        uses: dev-drprasad/delete-tag-and-release@5eafd8668311bf3e4d6c1e9898f32a317103de68 # v0.2.1
        if: ${{ steps.vars.outputs.is_release_type_latest == 'true' }}
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          delete_release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          files: release/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
