<svg xmlns="http://www.w3.org/2000/svg" viewBox="72 52 656 656" width="512" height="512" role="img" aria-label="Mallchain emblem: a network of blocks with a gold Mallcoin spinning at the center">
<!--
  Emblem-only static derivative of the canonical animated brand logo
  (public/mallchain.svg). Identical geometry and palette; animations,
  pulse rings, and the wordmark are stripped so small renders
  (favicon, sidebar marks) always show the complete emblem.
-->
<defs>
<style>
.o{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.t{fill:none;stroke:#3fd6c6;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.l{fill:none;stroke:#ff1f78;stroke-width:1.6;opacity:.55}
.halo{fill:none;stroke:#ff1f78;stroke-width:2.5;stroke-dasharray:1 8;stroke-linecap:round;opacity:.7}
.g{fill:none;stroke:#d9a441;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
</style>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc9a"/><stop offset=".5" stop-color="#c8963a"/><stop offset="1" stop-color="#8a5f1d"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#f0c15a" stop-opacity=".5"/><stop offset="1" stop-color="#f0c15a" stop-opacity="0"/></radialGradient>
<clipPath id="face"><circle r="68"/></clipPath>
<path id="arcTop" d="M-80,0 A80,80 0 0 1 80,0"/>
<path id="arcBot" d="M-81,0 A81,81 0 0 0 81,0"/>
<g id="cube">
<path d="M0,-100 L87,-50 L87,50 L0,100 L-87,50 L-87,-50Z" fill="#121317"/>
<path class="o" pathLength="100" d="M0,-100 L87,-50 L87,50 L0,100 L-87,50 L-87,-50Z"/>
<path class="o" pathLength="100" d="M-87,-50 L0,0 L87,-50 M0,0 L0,100"/>
<path class="t" pathLength="100" d="M0,-45 L39,-22 L39,22 L0,45 L-39,22 L-39,-22Z"/>
</g>
<g id="mini"><path d="M0,-100 L87,-50 L87,50 L0,100 L-87,50 L-87,-50Z M-87,-50 L0,0 L87,-50 M0,0 L0,100" fill="#121317" stroke="#3fd6c6" stroke-width="10" stroke-linejoin="round"/></g>
<g id="mc"><circle r="7.5" fill="url(#gold)"/><circle r="5" fill="#1c1c1f"/><path d="M-2.8,2.6 V-2.6 H-1.7 L0,-.3 L1.7,-2.6 H2.8 V2.6 H1.7 V-.9 L0,1.5 L-1.7,-.9 V2.6Z" fill="#f0c15a"/></g>
</defs>
<rect x="72" y="52" width="656" height="656" rx="140" fill="#121317"/>
<circle class="halo" cx="400" cy="380" r="110"/>
<circle class="halo" cx="400" cy="380" r="205"/>
<g><path class="l" d="M400,380 L570,380"/><path class="l" d="M400,380 L485,501"/><path class="l" d="M400,380 L315,501"/><path class="l" d="M400,380 L230,380"/><path class="l" d="M400,380 L315,259"/><path class="l" d="M400,380 L485,259"/><path class="l" d="M570,380 L485,501"/><path class="l" d="M485,501 L315,501"/><path class="l" d="M315,501 L230,380"/><path class="l" d="M230,380 L315,259"/><path class="l" d="M315,259 L485,259"/><path class="l" d="M485,259 L570,380"/><path class="l" d="M660,505 L570,380"/><path class="l" d="M660,505 L485,501"/><path class="l" d="M400,630 L485,501"/><path class="l" d="M400,630 L315,501"/><path class="l" d="M140,505 L315,501"/><path class="l" d="M140,505 L230,380"/><path class="l" d="M140,255 L230,380"/><path class="l" d="M140,255 L315,259"/><path class="l" d="M400,130 L315,259"/><path class="l" d="M400,130 L485,259"/><path class="l" d="M660,255 L485,259"/><path class="l" d="M660,255 L570,380"/></g>
<use href="#cube" transform="translate(570,380) scale(0.36)"/><use href="#cube" transform="translate(485,501) scale(0.36)"/><use href="#cube" transform="translate(315,501) scale(0.36)"/><use href="#cube" transform="translate(230,380) scale(0.36)"/><use href="#cube" transform="translate(315,259) scale(0.36)"/><use href="#cube" transform="translate(485,259) scale(0.36)"/><use href="#cube" transform="translate(660,505) scale(0.3)"/><use href="#cube" transform="translate(400,630) scale(0.3)"/><use href="#cube" transform="translate(140,505) scale(0.3)"/><use href="#cube" transform="translate(140,255) scale(0.3)"/><use href="#cube" transform="translate(400,130) scale(0.3)"/><use href="#cube" transform="translate(660,255) scale(0.3)"/>
<use href="#mini" transform="translate(700,380) scale(.09)"/><use href="#mini" transform="translate(100,380) scale(.09)"/><use href="#mini" transform="translate(255,610) scale(.09)"/><use href="#mini" transform="translate(545,610) scale(.09)"/><use href="#mini" transform="translate(255,150) scale(.09)"/><use href="#mini" transform="translate(545,150) scale(.09)"/><use href="#mini" transform="translate(400,255) scale(.09)"/><use href="#mini" transform="translate(400,505) scale(.09)"/>
<g transform="translate(400,380) scale(.78)">
<path d="M0,-100 L87,-50 L87,50 L0,100 L-87,50 L-87,-50Z" fill="#121317" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
<path d="M-87,-50 L0,0 L87,-50 M0,0 L0,100" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
<path d="M0,-70 L61,-35 L61,35 L0,70 L-61,35 L-61,-35Z" fill="none" stroke="#3fd6c6" stroke-width="3.5" stroke-linejoin="round"/>
</g>
<g transform="translate(400,372)">
<circle r="72" fill="url(#glow)"/>
<g transform="scale(.5)"><g>
<circle r="100" fill="url(#gold)"/><circle r="94" fill="#1c1c1f"/>
<circle r="70" fill="#242426" stroke="url(#gold)" stroke-width="2.5"/>
<g clip-path="url(#face)">
<path class="g" d="M-60,-30 H-40 V-50 H-20 M-62,-10 H-44 M-55,10 H-35 V30 M50,-45 L30,-25 H10 M62,-15 H45 V5 M55,25 H30 M20,-60 V-40 M-10,-62 V-45 H-25"/>
<path class="g" d="M-30,45 A25,25 0 0 1 30,45 M-40,52 A38,38 0 0 1 40,52"/>
<rect class="g" x="-8" y="42" width="16" height="16"/>
