<path d="M-42,38 V-38 H-28 L0,-4 L28,-38 H42 V38 H28 V-8 L0,26 L-28,-8 V38Z" fill="url(#gold)" stroke="#f6dc9a" stroke-width="1.5" stroke-linejoin="round"/>
<text font-family="Georgia,serif" font-size="15" font-weight="700" letter-spacing="3" fill="#e8c16f" text-anchor="middle"><textPath href="#arcTop" startOffset="50%">MALLCOIN</textPath></text>
<text font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#e8c16f" text-anchor="middle" dominant-baseline="hanging"><textPath href="#arcBot" startOffset="50%">On the Mallchain network</textPath></text>
</g></g></g>
</svg>
