# Alertmanager configuration for Mallchain.
# Auto-generated from .env.secrets on 2026-09-25 08:33:12 UTC
# DO NOT EDIT DIRECTLY - regenerate from template instead.

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.mailtrap.io:2525'
  smtp_from: 'alertmanager@mallchain.io'
  smtp_auth_username: 'your_mailtrap_username'
  smtp_auth_password: 'your_mailtrap_password'
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'default-email'
  group_by: ['alertname', 'namespace', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: 'pager-duty'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    - match:
        severity: critical
      receiver: 'slack-critical'
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'slack-warnings'
      group_wait: 30s
      repeat_interval: 4h

    - match:
        severity: info
      receiver: 'slack-warnings'
      group_wait: 1m
      repeat_interval: 12h

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'namespace']

  - source_match:
      alertname: MallchainBackendDown
    target_match_re:
      alertname: 'HighHttp5xxErrorRate|HighRequestLatencyP95|BackendErrorRateSpike|PaymentFailureSpike|TransactionQueueJobFailureRate|BullMQ.*'
    equal: ['job']

receivers:
  - name: 'default-email'
    email_configs:
      - to: 'ops-team@mallchain.io'
        send_resolved: true
        headers:
          Subject: '[Mallchain] {{ .GroupLabels.alertname }} ({{ .GroupLabels.job }})'

  - name: 'pager-duty'
    pagerduty_configs:
      - service_key: 'your_pagerduty_test_service_key'
        severity: '{{ .CommonLabels.severity }}'
        component: '{{ .CommonLabels.job }}'
        group: '{{ .CommonLabels.namespace }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          description: '{{ .CommonAnnotations.description }}'
          runbook: '{{ .CommonAnnotations.runbook }}'

  - name: 'slack-critical'
    slack_configs:
      - api_url: 'https://webhook.site/your-unique-id-critical'
        channel: '#mallchain-critical'
        send_resolved: true
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          *Job:* {{ .Labels.job }}
          {{ if .Annotations.runbook }}*Runbook:* {{ .Annotations.runbook }}{{ end }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: 'slack-warnings'
    slack_configs:
      - api_url: 'https://webhook.site/your-unique-id-warnings'
        channel: '#mallchain-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Severity:* {{ .Labels.severity }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          {{ if .Annotations.runbook }}*Runbook:* {{ .Annotations.runbook }}{{ end }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
