#cloud-config
package_update: true
package_upgrade: true
packages:
  - unzip
  - jq

write_files:
  - path: /etc/vault.d/vault.hcl
    permissions: '0640'
    content: |
      ui = true
      listener "tcp" {
        address         = "0.0.0.0:8200"
        cluster_address = "0.0.0.0:8201"
        tls_cert_file   = "/opt/vault/tls/tls.crt"
        tls_key_file    = "/opt/vault/tls/tls.key"
      }
      storage "raft" {
        path    = "/opt/vault/data"
        node_id = "vault-0"
      }
      api_addr     = "https://__PRIVATE_IP__:8200"
      cluster_addr = "https://__PRIVATE_IP__:8201"

  - path: /etc/systemd/system/vault.service
    permissions: '0644'
    content: |
      [Unit]
      Description="HashiCorp Vault"
      Documentation=https://www.vaultproject.io/docs/
      Requires=network-online.target
      After=network-online.target
      ConditionFileNotEmpty=/etc/vault.d/vault.hcl

      [Service]
      User=vault
      Group=vault
      ProtectSystem=strict
      ProtectHome=read-only
      PrivateTmp=yes
      PrivateDevices=yes
      SecureBits=keep-caps
      AmbientCapabilities=CAP_IPC_LOCK
      CapabilityBoundingSet=CAP_SYSLOG CAP_IPC_LOCK
      NoNewPrivileges=yes
      ExecStart=/usr/local/bin/vault server -config=/etc/vault.d/vault.hcl
      ExecReload=/bin/kill --signal HUP $MAINPID
      KillMode=process
      KillSignal=SIGINT
      Restart=on-failure
      RestartSec=5
      TimeoutStopSec=30
      LimitNOFILE=65536
      LimitMEMLOCK=infinity

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/vault-bootstrap.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Vault init/unseal/AppRole bootstrap
      After=vault.service

      [Service]
      Type=oneshot
      ExecStart=/opt/vault/bootstrap.sh
      RemainAfterExit=yes
      TimeoutStartSec=300

      [Install]
      WantedBy=multi-user.target

  - path: /opt/vault/policy.hcl
    permissions: '0644'
    content: |
      path "secret/data/marketplace/*" {
        capabilities = ["read"]
      }

  - path: /opt/vault/bootstrap.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      # Vault bootstrap: init -> SSM backup -> unseal -> kv-v2 -> AppRole.
      # Idempotent: runs from runcmd on first boot and via
      # vault-bootstrap.service at every subsequent boot (Vault comes up
      # sealed after a restart).
      set -euo pipefail

      export VAULT_ADDR=https://127.0.0.1:8200
      export VAULT_SKIP_VERIFY=true

      TOKEN=$(curl -fsS -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
      export AWS_DEFAULT_REGION=$(curl -fsS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)

      # wait for the Vault API to answer (up to ~2 min)
      for i in $(seq 1 60); do
        if curl -sk -o /dev/null https://127.0.0.1:8200/v1/sys/health; then break; fi
        sleep 2
      done
      curl -sk -o /dev/null https://127.0.0.1:8200/v1/sys/health

      STATUS=$(vault status -format=json 2>/dev/null || true)
      INITIALIZED=$(jq -r '.initialized // false' <<<"$STATUS")
      SEALED=$(jq -r '.sealed // true' <<<"$STATUS")

      if [ "$INITIALIZED" != "true" ] && [ ! -f /opt/vault/init.json ]; then
        vault operator init -key-shares=1 -key-threshold=1 -format=json > /opt/vault/init.json
        chmod 600 /opt/vault/init.json
      fi
      if [ ! -f /opt/vault/init.json ]; then
        # initialized but this disk lost init.json - restore from SSM
        aws ssm get-parameter --name ${ssm_prefix}/init --with-decryption \
          --query Parameter.Value --output text > /opt/vault/init.json
        chmod 600 /opt/vault/init.json
      fi

      aws ssm put-parameter --name ${ssm_prefix}/init --type SecureString \
        --value "file:///opt/vault/init.json" --overwrite > /dev/null

      if [ "$SEALED" == "true" ]; then
        vault operator unseal "$(jq -r '.unseal_keys_b64[0]' /opt/vault/init.json)" > /dev/null
      fi

      export VAULT_TOKEN=$(jq -r '.root_token' /opt/vault/init.json)

      if ! vault secrets list | grep -q '^secret/ '; then
        vault secrets enable -path=secret kv-v2
      fi
      if ! vault auth list | grep -q '^approle/ '; then
        vault auth enable approle
      fi
      vault policy write mallchain-backend /opt/vault/policy.hcl > /dev/null
      vault write auth/approle/role/mallchain-backend \
        token_policies=mallchain-backend token_ttl=1h token_max_ttl=4h secret_id_ttl=0 > /dev/null

      if ! aws ssm get-parameter --name ${ssm_prefix}/role-id > /dev/null 2>&1; then
        ROLE_ID=$(vault read -field=role_id auth/approle/role/mallchain-backend/role-id)
        SECRET_ID=$(vault write -f -field=secret_id auth/approle/role/mallchain-backend/secret-id)
        aws ssm put-parameter --name ${ssm_prefix}/role-id --type String \
          --value "$ROLE_ID" --overwrite > /dev/null
        aws ssm put-parameter --name ${ssm_prefix}/secret-id --type SecureString \
          --value "$SECRET_ID" --overwrite > /dev/null
      fi

      aws ssm put-parameter --name ${ssm_prefix}/ca-cert --type String \
        --value "file:///opt/vault/tls/tls.crt" --overwrite > /dev/null

      echo "vault bootstrap complete"

runcmd:
  - |
    set -euo pipefail
    swapoff -a
    sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab
    echo 'net.ipv4.tcp_numa_balancing=0' >> /etc/sysctl.conf
    echo 'kernel.numa_balancing=0' >> /etc/sysctl.conf
    sysctl -p

    curl -fsSL https://releases.hashicorp.com/vault/1.16.2/vault_1.16.2_linux_arm64.zip -o /tmp/vault.zip
    unzip -o /tmp/vault.zip -d /usr/local/bin/
    chmod +x /usr/local/bin/vault
    setcap cap_ipc_lock=+ep /usr/local/bin/vault

    useradd --system --home /etc/vault.d --shell /bin/false vault || true
    chown vault:vault /etc/vault.d/vault.hcl
    chmod 640 /etc/vault.d/vault.hcl

    # mount the dedicated data volume (Nitro: EBS volumes surface as nvme devices)
    ROOT_DISK=$(lsblk -no PKNAME "$(findmnt -n -o SOURCE /)")
    DATA_DEV=""
    for d in /dev/nvme*n1; do
      if [ "$(basename "$d")" != "$ROOT_DISK" ]; then DATA_DEV=$d; break; fi
    done
    if [ -n "$DATA_DEV" ] && ! blkid "$DATA_DEV" > /dev/null 2>&1; then
      mkfs -t xfs "$DATA_DEV"
    fi
    mkdir -p /opt/vault/data
    if [ -n "$DATA_DEV" ]; then
      mount "$DATA_DEV" /opt/vault/data
      DATA_UUID=$(blkid -s UUID -o value "$DATA_DEV")
      grep -q "/opt/vault/data" /etc/fstab || echo "UUID=$DATA_UUID /opt/vault/data xfs defaults,nofail 0 2" >> /etc/fstab
    fi
    chown -R vault:vault /opt/vault/data

    TOKEN=$(curl -fsS -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
    PRIVATE_IP=$(curl -fsS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
    mkdir -p /opt/vault/tls
    openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
      -keyout /opt/vault/tls/tls.key -out /opt/vault/tls/tls.crt \
      -subj "/CN=vault.internal" \
      -addext "subjectAltName=DNS:vault.internal,IP:$PRIVATE_IP"
    chown vault:vault /opt/vault/tls/tls.key /opt/vault/tls/tls.crt
    chmod 600 /opt/vault/tls/tls.key

    sed -i "s/__PRIVATE_IP__/$PRIVATE_IP/g" /etc/vault.d/vault.hcl

    systemctl daemon-reload
    systemctl enable vault vault-bootstrap.service
    systemctl start vault
    /opt/vault/bootstrap.sh
