<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://mallchain.network/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>Mallchain Network — Decentralized Operating System for Commerce &amp; Creators</title>
    <meta name="description" content="Mallchain Network is the decentralized operating system for commerce, creators, and communities: on-chain wallet, mining rewards, marketplace, staking, KYC-verified profiles and instant M-Pesa top-up." />
    <meta name="keywords" content="Mallchain, blockchain marketplace, decentralized commerce, Mallcoin, MLPTS, crypto wallet, M-Pesa crypto, creator economy, Web3 marketplace" />
    <meta name="author" content="Mallchain Network" />
    <meta name="application-name" content="Mallchain Network" />
    <meta name="theme-color" content="#050810" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mallchain Network" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://mallchain.network/" />
    <meta property="og:title" content="Mallchain Network — Decentralized Operating System for Commerce &amp; Creators" />
    <meta property="og:description" content="On-chain wallet, mining rewards, marketplace, staking and instant M-Pesa top-up. Built for the next generation of digital commerce." />
    <meta property="og:image" content="https://mallchain.network/mallchain.svg" />
    <meta property="og:image:alt" content="Mallchain Network logo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mallchain Network — Decentralized OS for Commerce" />
    <meta name="twitter:description" content="On-chain wallet, mining rewards, marketplace, staking and M-Pesa top-up." />
    <meta name="twitter:image" content="https://mallchain.network/mallchain.svg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://mallchain.network/#org",
            "name": "Mallchain Network",
            "url": "https://mallchain.network/",
            "logo": "https://mallchain.network/mallchain.svg",
            "sameAs": [
              "https://x.com/mallchain",
              "https://github.com/mallchain-network"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://mallchain.network/#site",
            "url": "https://mallchain.network/",
            "name": "Mallchain Network",
            "publisher": { "@id": "https://mallchain.network/#org" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Mallchain Network requires JavaScript. Enable it to access the decentralized commerce OS, or email support@mallchain.network.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
