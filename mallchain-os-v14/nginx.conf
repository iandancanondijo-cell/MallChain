# Static asset server for the Vite build (dist/). Hash-based routing means
# every real request is for an actual file — no SPA fallback/rewrite rules
# needed (see vite.config.ts's routing comment).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Non-root nginx can't write its default PID/temp paths under /var/run
  # etc. as root would — Dockerfile already chowns those to the non-root
  # user, so no further config needed here beyond listening on an
  # unprivileged port.

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed filenames (Vite's default build output) can be cached
  # aggressively; index.html itself must always be revalidated so a new
  # deploy is picked up on next load instead of being served from cache.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
