syntax = "proto3";

package marketplace.vault.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/tmp/marketplace/x/vault/types";

// Query defines the gRPC querier service for the vault module. Reads are
// plain RPC/REST calls — unlike a Msg, a query response is never broadcast
// or stored in chain history, so returning the encrypted blob here (for the
// client to decrypt locally) doesn't expose anything beyond what's already
// sitting in public chain state.
service Query {
  rpc VaultBlob(QueryVaultBlobRequest) returns (QueryVaultBlobResponse) {
    option (google.api.http).get = "/marketplace/vault/v1/blob/{owner}";
  }
}

message QueryVaultBlobRequest {
  string owner = 1;
}

message QueryVaultBlobResponse {
  bool found = 1;
  string salt = 2;
  uint32 kdf_time = 3;
  uint32 kdf_memory = 4;
  uint32 kdf_threads = 5;
  uint32 kdf_key_len = 6;
  string nonce_totp = 7;
  string encrypted_totp_secret = 8;
  string nonce_priv = 9;
  string ciphertext = 10;
  string public_key = 11;
}
